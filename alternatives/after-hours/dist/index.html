  <main>
    <p>Hi, I’m Rahul!</p>
    <p>I like building things, writing, and exploring new ideas.</p>
    <p>Lately, I’ve been making interactive worlds for the web. One of them is a <a href="https://rahulashwinhira.github.io/response-to-the-intelligence-age/">response to The Intelligence Age</a>, where an essay becomes a place to explore.</p>
    <p>You can find more of <a href="https://github.com/rahulashwinhira">my projects on GitHub</a>.</p>
    <p>Best,<br>Rahul Hira</p>
  </main>
